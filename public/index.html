<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BudgetFriendly</title>
  <meta name="description" content="Personal budgeting.">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen behaviour: full-screen, no Safari chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">BudgetFriendly</span>
      </div>
      <nav class="nav" id="desktop-nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" id="sync-btn">Sync now</button>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="view-title" id="view-title">Dashboard</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" id="sync-btn-mobile" aria-label="Sync now">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    d="M20 11a8 8 0 1 0-.6 3M20 5v6h-6"/>
            </svg>
          </button>
          <a class="btn btn-ghost btn-icon" href="#/settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>
            </svg>
          </a>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>

    <nav class="tabbar" id="mobile-nav"></nav>
  </div>

  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand brand-lg">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">BudgetFriendly</span>
      </div>
      <p class="muted">Sign in to your budget.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required inputmode="email">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="sheet" class="sheet">
    <div class="sheet-inner" id="sheet-body"></div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
