<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BudgetFriendly</title>
  <meta name="description" content="Personal budgeting.">
  <meta name="theme-color" content="#f5f6fa" id="theme-color">
  <meta name="color-scheme" content="light dark">
  <!-- Applies a saved light or dark choice before the first paint. -->
  <script src="/js/theme.js"></script>

  <!-- iOS home-screen behaviour: full-screen, no Safari chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>BudgetFriendly</div>
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" name="email" autocomplete="username" inputmode="email" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true"></span>BudgetFriendly</a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <button class="btn btn-primary btn-block" type="button" data-action="upload" data-tour="upload" id="side-upload"></button>
        <div class="side-tools" id="side-tools"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
        <div class="topbar-tools">
          <button class="icon-btn" type="button" data-action="theme" data-tour="theme" id="theme-toggle" aria-label="Switch theme"></button>
          <button class="icon-btn only-mobile" type="button" data-action="upload" data-tour="upload" aria-label="Upload statement" id="top-upload"></button>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="dropzone" id="dropzone" hidden><div class="dropzone-inner">Drop your statement to import it</div></div>
  <div class="chart-tooltip" id="chart-tooltip" hidden></div>
  <input type="file" id="file-input" accept=".ofx,.qfx,.csv,.txt" hidden>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
